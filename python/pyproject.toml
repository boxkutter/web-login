[project]
name = "boxkutter-web-login"
version = "0.4.0"
description = "Local sign-in for web services: password, authenticator app, recovery codes, sessions, email tokens, and optional OpenID Connect. Framework-light core with a FastAPI router."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "pyjwt[crypto]>=2.8",
  "httpx>=0.27",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
redis = ["redis>=5"]
async = ["sqlalchemy[asyncio]>=2.0", "fastapi>=0.110"]
dev = ["pytest>=8", "ruff>=0.5", "fastapi>=0.110", "redis>=5", "fakeredis>=2.20", "sqlalchemy[asyncio]>=2.0", "aiosqlite>=0.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_login"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
